[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoxu-knowledge-service"
version = "1.0.0"
description = "GPU-only BGE-M3 knowledge service backed by SQLite and Milvus"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[project.scripts]
knowledge-api = "knowledge_service.api.app:main"
knowledge-admin = "knowledge_service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/runtime.txt"]}

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

